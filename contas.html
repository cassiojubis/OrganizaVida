<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Módulo de contas do OrganizaVida para controle de despesas, vencimentos e pagamentos.">
    <title>Contas | OrganizaVida</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="container">
    <h1>🧾 Contas a Pagar</h1>
    <p>Controle vencimentos, valores e status de pagamento para manter suas finanças em dia.</p>

   <form class="form-rotina" onsubmit="adicionarConta(); return false;">
    <input type="text" id="nomeConta" placeholder="Nome da conta" required>
    <input type="number" id="valorConta" placeholder="Valor (R$)" required>
    <input type="date" id="vencimentoConta" required>
    <button type="submit">Adicionar</button>
</form>


    <ul class="lista" id="listaContas"></ul>

    <a href="home.html" class="voltar">⬅ Voltar</a>
</div>
<script src="contas.js"></script>
</body>
</html>
