<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Módulo de salário do OrganizaVida para registrar ganhos mensais e renda extra.">
    <title>Salário | OrganizaVida</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="container">
    <h1>💰 Meu Salário</h1>
    <p>Registre seus ganhos fixos e extras para acompanhar seu poder financeiro mensal.</p>

    <form class="form-rotina" onsubmit="salvarSalario(); return false;">
        <input type="number" id="salario" placeholder="Salário mensal (R$)" required>
        <input type="number" id="rendaExtra" placeholder="Renda extra (R$)">
        <button type="submit">Salvar</button>
    </form>

    <a href="home.html" class="voltar">⬅ Voltar</a>
</div>

<script src="salario.js"></script>
</body>
</html>
