<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Módulo de rotina do OrganizaVida para cadastro e acompanhamento de tarefas diárias.">
    <title>Rotina | OrganizaVida</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="container">
        <h1>📅 Minha Rotina</h1>
        <p>Planeje seu dia com tarefas organizadas por horário e acompanhe o que já foi concluído.</p>

        <!-- Formulário -->
        <form class="form-rotina">
            <input type="text" id="tarefa" placeholder="Nome da tarefa" required>
            <input type="time" id="hora" required>
            <button type="button" onclick="adicionarTarefa()">Adicionar</button>
        </form>

        <!-- Lista de tarefas -->
        <ul class="lista" id="listaTarefas"></ul>

        <a href="home.html" class="voltar">⬅ Voltar</a>
    </div>
    
    <script src="rotina.js"></script>

</body>
</html>
